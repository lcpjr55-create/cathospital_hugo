- title: "Dental Care"
  description: "From routine cleanings to extractions, our veterinarians use digital dental x-rays and careful monitoring to protect your cat's teeth and overall health."
  image: "/images/7/5/8/2/75820791/img-2375_orig.jpg"
  link: "/dental-care"

- title: "Surgical Care"
  description: "Routine spays and neuters, soft-tissue surgeries, and mass removals performed in our modern surgical suite with continuous vital sign monitoring."
  image: "/images/7/5/8/2/75820791/surgery_orig.jpg"
  link: "/surgical-care"

- title: "Geriatric Medicine"
  description: "Senior cats thrive with attentive, proactive care. We watch closely for age-related conditions like kidney disease, hyperthyroidism, and arthritis."
  image: "/images/7/5/8/2/75820791/img-2372_orig.jpg"
  link: "/geriatric-medicine"

- title: "Radiological Examinations"
  description: "Our fully integrated digital x-ray system delivers exceptional image clarity, helping us diagnose and treat your cat accurately and quickly."
  image: "/images/7/5/8/2/75820791/radiology_1_orig.jpg"
  link: "/radiological-examinations"

- title: "Ultrasound"
  description: "Ultrasound is a powerful, non-invasive tool for evaluating masses, urinary issues, and cardiac conditions. We work with a specialist who visits by appointment."
  image: "/images/7/5/8/2/75820791/treatment_orig.jpg"
  link: "/ultrasonic-examinations"
